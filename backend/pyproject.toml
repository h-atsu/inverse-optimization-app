[project]
name = "inverse-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "h-atsu", email = "jhuim08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "polars>=1.44.0",
    "pydantic>=2.13.4",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
inverse-optimization = "inverse_optimization:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
